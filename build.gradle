plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'jp.co.fullness.ddd'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"

	// Swagger UI 同梱。Spring Boot 4（Spring Framework 7）対応版。
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'  
}

tasks.named('test') {
	useJUnitPlatform()
}

javadoc {
    // --- 文字コード（日本語対応。3つとも UTF-8 に揃えるのが要点）---
    options.encoding    = 'UTF-8'   // ソース(.java)の読み込みエンコーディング
    options.charSet     = 'UTF-8'   // 生成HTMLの <meta charset>
    options.docEncoding = 'UTF-8'   // 生成HTMLの書き出しエンコーディング

    // --- 見た目・範囲 ---
    title = '商品管理API (MyBatis版) — ドメイン駆動設計 実践サンプル'
    options.locale = 'ja_JP'                 // 生成UIの言語（"パッケージ" 等の見出しを日本語に）
    options.memberLevel = JavadocMemberLevel.PROTECTED  // public/protected を対象（private は除外）
    options.addBooleanOption('author', true) // @author を出力
    options.addBooleanOption('version', true)// @version / @since を出力

    // --- doclint 無効化（@param 等の不足でビルドを止めない）---
    options.addStringOption('Xdoclint:none', '-quiet')

    // --- 外部 JavaDoc へのリンク（型名からリンクを張る）---
    options.links(
        'https://docs.oracle.com/en/java/javase/21/docs/api/'
    )

    // 警告を減らしたい場合（任意）
    options.addStringOption('quiet')
}